[unix_http_server]
file=%(ENV_FORESEEBENCH_SOCKET)s
chmod=0700

[supervisord]
identifier=foreseebench
logfile=%(ENV_FORESEEBENCH_ROOT)s/data/service/supervisor.log
logfile_maxbytes=1MB
logfile_backups=2
pidfile=%(ENV_FORESEEBENCH_ROOT)s/data/service/supervisor.pid
childlogdir=%(ENV_FORESEEBENCH_ROOT)s/data/service
umask=0077

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix://%(ENV_FORESEEBENCH_SOCKET)s

[program:foreseebench]
directory=%(ENV_FORESEEBENCH_ROOT)s
command=/usr/bin/flock --exclusive --nonblock --no-fork "%(ENV_FORESEEBENCH_ROOT)s/data/service/runner.lock" "%(ENV_FORESEEBENCH_ROOT)s/.venv/bin/foreseebench" --config "%(ENV_FORESEEBENCH_ROOT)s/foreseebench.toml" --bootstrap run
autostart=false
autorestart=true
startsecs=3
startretries=3
stopsignal=TERM
stopwaitsecs=90
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=%(ENV_FORESEEBENCH_ROOT)s/data/service/worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=2
environment=PYTHONUNBUFFERED="1"
