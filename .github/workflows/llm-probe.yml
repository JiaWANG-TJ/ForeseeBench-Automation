name: LLM interface probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foreseebench-llm-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: '0.13.7'
          python-version: '3.12.7'
          enable-cache: false
      - run: uv sync --locked --no-dev
      - name: Verify the live model
        env:
          LLM_BASE_URL: ${{ secrets.LLM_BASE_URL }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          LLM_MODEL: DeepSeek-V4.1-Flash-1017
        run: uv run --no-sync python -m foreseebench.llm --output llm-probe.json
      - name: Write the probe summary
        if: always()
        run: |
          if [[ -f llm-probe.json ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path('llm-probe.json').read_text())
          summary = {'model': report['model'], 'passed': report['passed'],
                     'cases': [{'name': row['name'], 'seconds': row['seconds'],
                                'content': row['response']['content']}
                               for row in report['cases']]}
          print('```json\n' + json.dumps(summary, ensure_ascii=False, indent=2) + '\n```')
          PY
          fi
